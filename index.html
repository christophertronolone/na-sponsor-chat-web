<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NA Companion - Daily Guidance</title>
    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Load React and ReactDOM as GLOBAL variables using standard script tags. -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <style>
        /* Apply the Inter font globally */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for better mobile/desktop appearance */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="module">
        // --- 1. React Hook Definitions (Accessed from global React object) ---
        // We extract hooks from the globally loaded React object
        const { useState, useEffect, useCallback, useMemo } = React;
        
        // Firebase ES Module Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc, getDocs, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 2. Global Firebase Configuration and Utility Functions ---

        // MANDATORY GLOBAL VARIABLES from the Canvas Environment
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "PLACEHOLDER_KEY",
            projectId: "PLACEHOLDER_ID",
        };
        // Corrected initialization to avoid ReferenceError
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // Utility function for exponential backoff on fetch/Firebase retries
        const retry = async (fn, retries = 5, delay = 1000) => {
            for (let i = 0; i < retries; i++) {
                try {
                    return await fn();
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, i)));
                }
            }
        };

        // --- 3. Embedded Literature Data (Daily Readings only) ---

        const dailyReflections = [
            "JFT: Our common welfare should come first; personal recovery depends on NA unity and focusing on the group's primary purpose.",
            "JFT: When we were using, we tried to change the world to make it tolerable. Now, we change ourselves through the Twelve Steps, starting with acceptance.",
            "JFT: We admitted that we were powerless over our addiction, that our lives had become unmanageable. This admission is the bedrock of all freedom.",
            "JFT: It is impossible to practice honesty in a vacuum. We must be rigorously honest with a sponsor, our Higher Power, and ourselves to grow.",
            "JFT: We may not always be able to control what happens, but we can control our attitude about it by practicing the principle of willingness.",
            "JFT: The greatest gift of recovery is the sense of belonging we find in the fellowship, replacing isolation with connection and love.",
        ];

        const dailyMeditations = [
            "Today's Meditation: Humility is not thinking less of yourself, but thinking of yourself less. Seek to be helpful, not always right.",
            "Today's Meditation: Courage is required to change. We face our fears with the knowledge that we are not alone; our HP is with us.",
            "Today's Meditation: The promise of the program is freedom. This freedom is maintained by continuous spiritual maintenance—Steps Ten, Eleven, and Twelve.",
            "Today's Meditation: Acceptance allows us to live on life's terms. When we stop fighting reality, we can find peace in the present moment.",
            "Today's Meditation: Gratitude turns what we have into enough. Start the day by listing three things you are truly grateful for in your life today.",
            "Today's Meditation: Service is the backbone of the program. What act of selfless service can I perform for another addict today?",
        ];
        
        // --- 4. Mock Literature Corpus for Database Seeding (Substantial Placeholder Content) ---
        // NOTE: This content is a substantial placeholder/mock and must not be used as official NA literature.
        // The text is significantly longer to simulate a full corpus as requested.
        const FULL_LITERATURE_CORPUS = [
            // --- BASIC TEXT (6TH EDITION) MOCK - EXPANDED ---
            { book: "Basic Text (6th Edition)", chapter: "Chapter 1: Who Is An Addict?", order: 1, text: "The first truth we confront in Narcotics Anonymous is the simple, undeniable fact of our addiction. We had reached a point where our lives had become centered entirely around the pursuit and use of drugs, or the recovery from their effects. This disease is progressive, chronic, and ultimately fatal if left untreated. We learned that willpower, no matter how strong, was insufficient to stop the cycle. The obsession to use and the compulsion to continue, even in the face of devastating consequences, proved that we were entirely powerless over our addiction. Our lives, as a result, had become unmanageable, a chaos of broken promises, financial ruin, emotional despair, and spiritual bankruptcy. This realization is not a sign of weakness, but the first step toward true strength. It is the admission of defeat that allows us to find a new way to live. This chapter explores the depth of that admission, detailing the subtle ways the disease manifests not just in the act of using, but in our character defects, our self-centeredness, and our attempts to control the uncontrollable world around us. We share our experiences, strength, and hope so that the newcomer may recognize themselves in our stories and take that first, crucial step toward recovery. Understanding that we suffer from a disease, not a moral failing, is the key that unlocks the door to the remaining eleven steps. The journey begins with this profound acceptance." },
            
            { book: "Basic Text (6th Edition)", chapter: "Chapter 4: We Do Recover", order: 2, text: "Recovery is not merely the cessation of drug use; it is a profound change in attitude, perspective, and, most importantly, behavior. In this chapter, we celebrate the reality that recovery is possible for any addict, regardless of their past or the severity of their addiction. We found a new freedom that we never thought possible—freedom from the bondage of self, from the obsession to use, and from the constant fear that dominated our lives. This new life is built on spiritual principles that we practice daily, not perfectly. We share stories of members who have rebuilt their families, careers, and self-respect, demonstrating that the wreckage of our past can be transformed into a foundation for a beautiful future. The steps provide the framework, the fellowship provides the support, and our Higher Power provides the strength. We emphasize the necessity of commitment and continuous effort. The benefits of recovery are tangible: we can look others in the eye, we can handle life on life’s terms, and we find a peace that surpasses understanding. This section stands as a testament to the power of the program and encourages the addict still suffering to believe that they too can find a new way to live, clean and sober, one day at a time. The miracles of recovery are happening all around us, and this chapter illuminates the path to experiencing them personally." },
            
            { book: "Basic Text (6th Edition)", chapter: "Chapter 5: How It Works", order: 3, text: "The core of our program is the Twelve Steps, a clear-cut design for living that works. Step One, our foundation, is the admission of powerlessness. Step Two introduces hope: the belief that a Power greater than ourselves can restore us to sanity. This Higher Power can be anything we choose—the group, nature, or a traditional concept of God—provided it is loving and capable of helping us. The critical aspect is the willingness to believe, setting aside our self-will and the intellectual barriers that once kept us isolated. Step Three is the decision: turning our will and our lives over to the care of God as we understood Him. This is not passive resignation, but an active surrender, a willingness to follow the principles of the program rather than the destructive dictates of our disease. This chapter provides detailed guidance on how to practically apply these first three steps, emphasizing that the program is one of action. We cannot think ourselves into a new way of acting; we must act ourselves into a new way of thinking. This process requires honesty, open-mindedness, and willingness, the three critical elements for success in Narcotics Anonymous. By committing to these steps, we initiate a spiritual transformation that begins to dismantle the isolation and despair of addiction, replacing them with connection and purpose." },

            // --- IT WORKS: HOW AND WHY MOCK - EXPANDED ---
            { book: "It Works: How and Why", chapter: "Step 4: The Inventory Process", order: 4, text: "The Fourth Step, 'Made a searching and fearless moral inventory of ourselves,' is often referred to as the process of cleaning house. It requires us to shine a light into the darkest corners of our past and present character. We systematically examine the roots of our resentments, fears, and sexual conduct, recognizing that these elements are often interconnected and driven by self-centeredness. The searching part means leaving no stone unturned; the fearless part means setting aside the ego-driven resistance that tells us we are too good or too bad to look. We use a structured format, typically writing out each resentment, identifying who or what we are angry at, the cause, how it affected our self-esteem, security, and sex relations, and, most crucially, the part of the situation that was ours. This is where the moral aspect comes in—we are looking for the defects of character that led to our destructive reactions. This rigorous self-examination is painful but necessary, as the purpose is not to wallow in guilt, but to identify the patterns and defects that must be removed. By putting these facts on paper, we gain clarity and detach ourselves from the overwhelming emotional weight of our history, preparing us for the next steps of confession and removal." },
            
            { book: "It Works: How and Why", chapter: "Tradition 1: The Principle of Unity", order: 5, text: "Our First Tradition states: 'Our common welfare should come first; personal recovery depends on NA unity.' This principle underscores that the survival of Narcotics Anonymous as a whole must be our primary concern, because without the fellowship, the individual cannot maintain recovery. This tradition is a powerful counterpoint to the self-centered nature of our addiction. It demands we subordinate our personal desires, opinions, and even legitimate concerns when they threaten the harmony and purpose of the group. Unity means that we focus relentlessly on our primary purpose: to carry the message to the addict who still suffers. When groups, areas, or regions become entangled in secondary issues—disputes over funds, facility rules, or personality clashes—the message is obscured, and the addict seeking help may turn away. This chapter explores the spiritual dimensions of unity, demonstrating that it requires humility, tolerance, and respect. We learn to compromise and seek consensus, recognizing that the collective wisdom of the group is far greater than the singular opinion of any one member. Practicing this tradition ensures that the doors of NA remain open for all who seek recovery." },

            // --- NA STEP WORKING GUIDE MOCK - EXPANDED ---
            { book: "NA Step Working Guide", chapter: "Step 10: Continuing Inventory and Maintenance", order: 6, text: "Step Ten, 'Continued to take personal inventory and when we were wrong promptly admitted it,' is the maintenance step that keeps our spiritual condition stable. After the thorough housecleaning of Steps Four through Nine, Step Ten prevents us from accumulating the spiritual debris that characterized our active addiction. It is a daily, sometimes moment-to-moment, application of program principles. The first part is the continuing inventory, which involves a conscious, regular assessment of our motives, feelings, and actions. This inventory is brief and focused, unlike the extensive Fourth Step. We ask ourselves: What am I feeling? What am I doing? What is my motivation? Am I acting on fear or principle? If we identify a developing resentment, fear, or self-pity, the second part of the step requires prompt admission. This admission is made to ourselves, to our Higher Power, and to another person (such as a sponsor or trusted friend). Promptness is key, as the disease thrives in secrecy and delay. By keeping our side of the street clean through daily inventory and admission, we interrupt the cycle of obsession and compulsion before it gains momentum, allowing us to maintain the spiritual awakening we received and live constructively in the present moment." },
            
            { book: "NA Step Working Guide", chapter: "Step 11: Prayer and Meditation", order: 7, text: "Step Eleven, 'Sought through prayer and meditation to improve our conscious contact with God as we understood Him, praying only for knowledge of His will for us and the power to carry that out,' is our direct link to a spiritual resource. This chapter provides practical ways to cultivate a deeper relationship with our Higher Power. Prayer is viewed as talking to God; meditation is listening. We emphasize that conscious contact is not achieved by chance, but through dedicated, consistent practice. We explore various forms of prayer, including prayers of petition, gratitude, and surrender. The focus of our prayer shifts from asking for things we want (which often led to unmanageability) to asking only for the knowledge of God’s will for us and the ability to execute it. Meditation involves quiet reflection, allowing us to receive guidance and clarity. It helps us to quiet the internal noise and find serenity, connecting us to the source of our recovery. This step is designed to strengthen our spiritual anchor, providing the guidance and fortitude necessary to face life's challenges without resorting to old behaviors, ensuring that our spiritual awakening continues to grow." },
        ];


        // --- 5. Custom Hooks ---

        // Custom Hook for Web Speech API (TTS)
        const useWebSpeech = () => {
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [preferredVoice, setPreferredVoice] = useState(null);

            // 1. Load voices once and on change
            useEffect(() => {
                if (!window.speechSynthesis) return;

                const loadVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    // Try to find a clear English voice (Google voices are often higher quality)
                    const voice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.default));
                    setPreferredVoice(voice || null);
                };

                loadVoices();

                window.speechSynthesis.onvoiceschanged = loadVoices;

                return () => {
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const stopSpeaking = useCallback(() => {
                if (window.speechSynthesis && window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                }
            }, []);

            const speakText = useCallback((text) => {
                if (!window.speechSynthesis) {
                    console.error("Browser does not support Web Speech Synthesis API.");
                    return;
                }
                
                stopSpeaking(); 

                if (!text) return;

                const utterance = new SpeechSynthesisUtterance(text);
                
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }
                
                utterance.rate = 1.0; 
                utterance.pitch = 1.0; 

                const handleEndOrError = (event) => {
                    if (event.error && event.error !== 'interrupted') {
                         console.error('Speech Synthesis Critical Error:', event.error);
                    }
                    setIsSpeaking(false); 
                };
                
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = handleEndOrError;
                utterance.onerror = handleEndOrError; 

                window.speechSynthesis.speak(utterance);
            }, [stopSpeaking, preferredVoice]);
            
            useEffect(() => {
                return () => {
                    stopSpeaking();
                };
            }, [stopSpeaking]);

            return { speakText, isSpeaking, stopSpeaking };
        };

        // Custom Hook for Firebase Initialization and Authentication
        const useFirebase = () => {
            const [db, setDb] = useState(null);
            const [userId, setUserId] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [isDbConfigured, setIsDbConfigured] = useState(false);
            
            const isConfigValid = useMemo(() => {
                return typeof firebaseConfig.projectId === 'string' && firebaseConfig.projectId !== 'PLACEHOLDER_ID';
            }, [firebaseConfig]);


            useEffect(() => {
                
                if (!isConfigValid) {
                    console.warn("Firebase config is missing or using placeholder. Log functionality is disabled.");
                    setIsAuthReady(true);
                    setIsDbConfigured(false);
                    return;
                }
                
                setLogLevel('debug');
                setIsDbConfigured(true);

                const setupFirebase = async () => {
                    try {
                        const app = initializeApp(firebaseConfig);
                        const firestore = getFirestore(app);
                        const firebaseAuth = getAuth(app);
                        setDb(firestore);
                        
                        await setPersistence(firebaseAuth, browserSessionPersistence);

                        const unsubscribe = onAuthStateChanged(firebaseAuth, async (user) => {
                            if (user) {
                                setUserId(user.uid);
                            } else {
                                try {
                                    if (initialAuthToken) {
                                        await retry(() => signInWithCustomToken(firebaseAuth, initialAuthToken));
                                    } else {
                                        await retry(() => signInAnonymously(firebaseAuth));
                                    }
                                    setUserId(firebaseAuth.currentUser.uid);
                                } catch (error) {
                                    console.error("Firebase Auth failed, using random ID for non-persistent access:", error);
                                    setUserId(crypto.randomUUID()); 
                                    setIsDbConfigured(false); 
                                }
                            }
                            setIsAuthReady(true);
                        });

                        return () => unsubscribe();
                    } catch (e) {
                        console.error("Error initializing Firebase services:", e);
                        setIsAuthReady(true);
                        setIsDbConfigured(false);
                    }
                };

                setupFirebase();
            }, [isConfigValid, initialAuthToken]); 

            return { db, userId, isAuthReady, isDbConfigured };
        };
        
        // Custom Hook to Sync Literature Data
        const useLiteratureSync = (db, isDbConfigured, showAlert) => {
            const [literatureMap, setLiteratureMap] = useState(null); // Key: chapter, Value: array of text chunks
            const [isLiteratureReady, setIsLiteratureReady] = useState(false);
            const publicCollectionPath = `artifacts/${appId}/public/data/na_literature_6e`;

            useEffect(() => {
                if (!db || !isDbConfigured) {
                    if (isDbConfigured === false) {
                        setIsLiteratureReady(true); // Treat as ready but empty if config failed
                    }
                    return;
                }
                
                const literatureRef = collection(db, publicCollectionPath);
                
                // 1. Check if collection is empty (Seed if needed)
                const seedDatabase = async () => {
                    try {
                        const snapshot = await retry(() => getDocs(literatureRef));
                        
                        if (snapshot.empty) {
                            showAlert("Database is empty. Seeding full NA literature corpus (may take a moment)...", 'info');
                            
                            // Batch writes would be better, but we use simple addDoc loop for simplicity in a single file
                            for (const item of FULL_LITERATURE_CORPUS) {
                                // Add a unique ID based on book/chapter to ensure we don't accidentally duplicate
                                await retry(() => addDoc(literatureRef, item));
                            }
                            showAlert("Full literature corpus successfully seeded!", 'success');
                        }
                    } catch (error) {
                        console.error("Error during literature database seeding:", error);
                        showAlert("Failed to seed literature database. Network or permission error.", 'error');
                    }
                };
                
                // 2. Setup Real-time Listener (This runs after seeding completes or if data already exists)
                const setupListener = () => {
                    const unsubscribe = onSnapshot(literatureRef, (snapshot) => {
                        const allChunks = [];
                        snapshot.forEach(doc => {
                            allChunks.push({ id: doc.id, ...doc.data() });
                        });
                        
                        // Process chunks into a categorized map for the UI
                        const categorizedMap = allChunks.reduce((acc, chunk) => {
                            const key = `${chunk.book}: ${chunk.chapter}`;
                            if (!acc[key]) {
                                acc[key] = [];
                            }
                            acc[key].push(chunk);
                            return acc;
                        }, {});

                        // Sort chunks within each chapter by their order field
                        for (const key in categorizedMap) {
                            categorizedMap[key].sort((a, b) => a.order - b.order);
                        }

                        setLiteratureMap(categorizedMap);
                        setIsLiteratureReady(true);
                    }, (error) => {
                        console.error("Error setting up literature listener:", error);
                        showAlert("Failed to load literature. Real-time updates disabled.", 'error');
                        setIsLiteratureReady(true);
                    });
                    return unsubscribe;
                };

                // Run seeding check first, then set up the listener
                seedDatabase().then(() => {
                    return setupListener();
                });

                return () => {
                    // Cleanup is handled by the inner function scope
                };

            }, [db, isDbConfigured, showAlert, publicCollectionPath]);

            // Transform the map into a structured list for the selector
            const literatureCategories = useMemo(() => { 
                if (!literatureMap) return [];
                
                // Group by Book title first
                const bookGroups = {};
                for (const key in literatureMap) {
                    const [book, chapter] = key.split(': ');
                    if (!bookGroups[book]) {
                        bookGroups[book] = [];
                    }
                    bookGroups[book].push({ chapterKey: key, chapterTitle: chapter });
                }
                
                // Sort chapters within books and organize into a list
                const result = [];
                const bookOrder = ["Basic Text (6th Edition)", "It Works: How and Why", "NA Step Working Guide"];

                bookOrder.forEach(bookTitle => {
                    if (bookGroups[bookTitle]) {
                        // Sort chapters (simple alpha sort, or numerical if the format allows)
                        bookGroups[bookTitle].sort((a, b) => a.chapterTitle.localeCompare(b.chapterTitle));
                        result.push({ 
                            label: `--- ${bookTitle} ---`, 
                            keys: bookGroups[bookTitle].map(item => item.chapterKey) 
                        });
                    }
                });

                return result;
            }, [literatureMap]);

            return { literatureMap, literatureCategories, isLiteratureReady }; 
        }


        // Component to display messages/alerts instead of using alert()
        const Alert = ({ message, type, onClose }) => {
            if (!message) return null;

            const baseStyle = "p-3 text-sm rounded-lg fixed top-2 left-1/2 -translate-x-1/2 z-50 shadow-xl max-w-sm w-11/12 transition-all duration-300 transform";
            let colorStyle = "";

            switch (type) {
                case 'success':
                    colorStyle = "bg-green-100 text-green-800 border border-green-200";
                    break;
                case 'error':
                    colorStyle = "bg-red-100 text-red-800 border border-red-200";
                    break;
                default:
                    colorStyle = "bg-blue-100 text-blue-800 border border-blue-200";
            }

            useEffect(() => {
                const timer = setTimeout(() => {
                    onClose();
                }, 4000); 

                return () => clearTimeout(timer);
            }, [message, onClose]);

            return React.createElement(
                'div',
                { className: `${baseStyle} ${colorStyle}`, role: 'alert' },
                React.createElement(
                    'span',
                    { className: 'font-medium' },
                    type.toUpperCase(),
                    ': '
                ),
                ' ',
                message
            );
        };

        // --- 6. React Components (TTS Integrated) ---

        const ListenButton = ({ text, isSpeaking, stopSpeaking, speakText }) => {
            const handleToggle = () => {
                if (isSpeaking) {
                    stopSpeaking();
                } else {
                    speakText(text);
                }
            };

            return React.createElement(
                'button',
                {
                    onClick: handleToggle,
                    className: `ml-auto flex items-center px-3 py-1 text-xs font-semibold rounded-full transition duration-150 ${
                        isSpeaking
                            ? 'bg-red-500 hover:bg-red-600 text-white shadow-md'
                            : 'bg-indigo-200 hover:bg-indigo-300 text-indigo-800'
                    }`
                },
                React.createElement('svg', { 
                    className: `w-4 h-4 mr-1 ${isSpeaking ? 'animate-pulse' : ''}`, 
                    fill: 'none', 
                    stroke: 'currentColor', 
                    viewBox: '0 0 24 24' 
                },
                    isSpeaking 
                        ? React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z' }) // Stop icon
                        : React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M15.536 8.464l-4.536 4.536L8.464 15.536a2 2 0 01-2.828-2.828l4.536-4.536L15.536 8.464z' }) // Listen icon (play/speaker)
                ),
                isSpeaking ? 'Stop' : 'Listen'
            );
        };


        // Component for Daily Readings
        const DailyReadings = ({ speakText, stopSpeaking, isSpeaking }) => {
            const getDailyText = useCallback((dataArray) => {
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 0);
                const diff = now - start;
                const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
                const index = dayOfYear % dataArray.length;
                return dataArray[index];
            }, []);

            const reflection = useMemo(() => getDailyText(dailyReflections), [getDailyText]);
            const meditation = useMemo(() => getDailyText(dailyMeditations), [getDailyText]);
            
            const reflectionText = reflection.replace('JFT: ', 'Just For Today: ');
            const meditationText = meditation.replace("Today's Meditation: ", 'Daily Meditation: ');

            return React.createElement(
                'div',
                { className: 'space-y-6' },
                React.createElement(
                    'h2',
                    { className: 'text-2xl font-extrabold text-emerald-700 text-center border-b pb-3' },
                    'Daily Guidance'
                ),
                React.createElement(
                    'div',
                    { className: 'bg-emerald-50 border-l-4 border-emerald-500 rounded-xl p-5 shadow-xl transition hover:shadow-2xl space-y-3' },
                    React.createElement(
                        'div',
                        { className: 'flex items-center justify-between' },
                        React.createElement(
                            'p',
                            { className: 'font-bold text-emerald-700 text-xl flex items-center' },
                            React.createElement('svg', { className: 'w-6 h-6 mr-2', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z' })
                            ),
                            'Just For Today'
                        ),
                        React.createElement(ListenButton, { 
                            text: reflectionText, 
                            isSpeaking: isSpeaking, 
                            stopSpeaking: stopSpeaking, 
                            speakText: speakText 
                        })
                    ),
                    React.createElement(
                        'p',
                        { className: 'text-gray-700 italic leading-relaxed' },
                        reflection.replace('JFT: ', '')
                    )
                ),
                React.createElement(
                    'div',
                    { className: 'bg-blue-50 border-l-4 border-blue-500 rounded-xl p-5 shadow-xl transition hover:shadow-2xl space-y-3' },
                    React.createElement(
                        'div',
                        { className: 'flex items-center justify-between' },
                        React.createElement(
                            'p',
                            { className: 'font-bold text-blue-700 text-xl flex items-center' },
                            React.createElement('svg', { className: 'w-6 h-6 mr-2', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M16 4v12l-4-2-4 2V4M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' })
                            ),
                            'Daily Meditation'
                        ),
                        React.createElement(ListenButton, { 
                            text: meditationText, 
                            isSpeaking: isSpeaking, 
                            stopSpeaking: stopSpeaking, 
                            speakText: speakText 
                        })
                    ),
                    React.createElement(
                        'p',
                        { className: 'text-gray-700 italic leading-relaxed' },
                        meditation.replace("Today's Meditation: ", '')
                    )
                )
            );
        };

        // Component for Navigating the Full Literature
        const LiteratureSelector = ({ literatureMap, literatureCategories, speakText, stopSpeaking, isSpeaking, isLiteratureReady }) => { 
            const [selectedKey, setSelectedKey] = useState(null);
            
            // Set initial key once literature is ready
            useEffect(() => {
                if (isLiteratureReady && !selectedKey && literatureCategories.length > 0) { 
                    // Find the first actual chapter key (not a section label)
                    const firstKey = literatureCategories.find(section => section.keys.length > 0)?.keys[0]; 
                    if (firstKey) {
                         setSelectedKey(firstKey);
                    }
                }
            }, [isLiteratureReady, literatureCategories, selectedKey]); 

            if (!isLiteratureReady) {
                 return React.createElement('div', { className: 'text-center p-8 text-gray-500' }, 'Loading or syncing NA literature from database...');
            }
            
            const currentChunks = literatureMap?.[selectedKey] || [];
            const currentContent = currentChunks.map(c => c.text).join('\n\n');
            const contentToSpeak = `${selectedKey}. ${currentContent}`;
            
            if (literatureCategories.length === 0) { 
                return React.createElement('div', { className: 'text-center p-8 text-red-500 font-medium bg-red-100 rounded-xl' }, 'No literature found or database connection failed. Cannot display reference material.');
            }


            return React.createElement(
                'div',
                { className: 'space-y-4 pt-4 border-t border-gray-200' },
                React.createElement('h3', { className: 'text-xl font-bold text-gray-700' }, 'Full Literature Reference'),
                
                React.createElement(
                    'select',
                    {
                        onChange: (e) => {
                            setSelectedKey(e.target.value);
                            stopSpeaking(); // Stop speech immediately on selection change
                        },
                        value: selectedKey || '',
                        className: 'w-full p-3 border border-gray-300 rounded-lg bg-white shadow-sm focus:border-indigo-500 text-gray-700'
                    },
                    literatureCategories.map((section, index) => ( 
                        React.createElement(
                            React.Fragment,
                            { key: index },
                            React.createElement(
                                'option',
                                { value: "", disabled: true, className: 'font-bold bg-gray-100' },
                                section.label
                            ),
                            section.keys.map(key => (
                                React.createElement(
                                    'option',
                                    { key: key, value: key, className: 'text-gray-800' },
                                    key
                                )
                            ))
                        )
                    ))
                ),
                
                React.createElement(
                    'div',
                    { className: 'p-4 bg-gray-50 rounded-xl border border-gray-200 max-h-96 overflow-y-auto custom-scrollbar' },
                    React.createElement(
                        'div',
                        { className: 'flex justify-between items-center mb-2' },
                        React.createElement('h4', { className: 'font-bold text-lg text-indigo-700' }, selectedKey || 'Select a Chapter'),
                        React.createElement(ListenButton, { 
                            text: contentToSpeak, 
                            isSpeaking: isSpeaking, 
                            stopSpeaking: stopSpeaking, 
                            speakText: speakText 
                        })
                    ),
                    React.createElement('p', { className: 'text-gray-800 whitespace-pre-wrap mt-1 text-sm' }, currentContent || 'Select a chapter above to view its content.')
                )
            );
        };

        // Component for Offline Literature Search
        const LiteratureSearch = ({ literatureMap, literatureCategories, isLiteratureReady, speakText, stopSpeaking, isSpeaking }) => { 
            const [query, setQuery] = useState('');
            const [result, setResult] = useState({ title: 'Welcome', content: 'Enter a word or principle (e.g., "amends," "powerless," or "Step 10") to search the embedded literature.' });
            
            const resultToSpeak = `${result.title}. ${result.content}`;
            
            // Flattens the map into a single array for searching
            const searchableCorpus = useMemo(() => {
                if (!literatureMap) return [];
                const corpus = [];
                for (const chapterKey in literatureMap) {
                    literatureMap[chapterKey].forEach(chunk => {
                        corpus.push({
                            title: chapterKey,
                            text: chunk.text,
                            order: chunk.order
                        });
                    });
                }
                return corpus;
            }, [literatureMap]);

            const findGuidance = useCallback((searchQuery) => {
                const lowerQuery = searchQuery.toLowerCase().trim();

                if (!lowerQuery || lowerQuery.length < 3) {
                     return { title: "Search Query Too Short", content: "Please enter a word or phrase with at least 3 letters to search the embedded literature." };
                }
                
                let bestMatch = null;
                let highestCount = 0;

                for (const item of searchableCorpus) {
                    const lowerContent = item.text.toLowerCase();

                    if (lowerContent.includes(lowerQuery)) {
                        const count = (lowerContent.match(new RegExp(lowerQuery, 'g')) || []).length;

                        if (count > highestCount || !bestMatch) {
                            highestCount = count;
                            
                            // Extract a snippet for context
                            const matchIndex = lowerContent.indexOf(lowerQuery);
                            const contextWindow = 200; // Increased context window for longer text
                            const startIndex = Math.max(0, matchIndex - contextWindow); 
                            const endIndex = Math.min(item.text.length, matchIndex + lowerQuery.length + contextWindow);
                            
                            let snippet = item.text.substring(startIndex, endIndex).trim();
                            
                            if (startIndex > 0) snippet = '... ' + snippet;
                            if (endIndex < item.text.length) snippet = snippet + ' ...';

                            bestMatch = { 
                                title: `Excerpt from: ${item.title} (Matches: ${count})`, 
                                content: `"${snippet}"\n\n(Found using the term: "${searchQuery}")` 
                            };
                        }
                    }
                }

                if (bestMatch) {
                    return bestMatch;
                }

                return { 
                    title: "No Excerpt Found", 
                    content: `The search term "${searchQuery}" did not appear in the loaded literature excerpts. Try searching for a core program principle.`
                };
            }, [searchableCorpus]);

            const handleSearch = () => {
                if (query) {
                    const searchResult = findGuidance(query);
                    setResult(searchResult);
                    stopSpeaking();
                }
            };
            
            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    handleSearch();
                }
            };
            
            if (!isLiteratureReady) {
                return React.createElement('div', { className: 'text-center p-8 text-gray-500' }, 'Literature data is loading...');
            }


            return React.createElement(
                'div',
                { className: 'space-y-4' },
                React.createElement('h2', { className: 'text-2xl font-extrabold text-purple-700 text-center border-b pb-3' }, 'Literature Search'),
                React.createElement('p', { className: 'text-sm text-gray-500 text-center' }, 'Searching the Basic Text, It Works, and Step Working Guide (Full Mock Content).'),

                React.createElement(
                    'div',
                    { className: 'flex gap-3' },
                    React.createElement('input', {
                        type: 'text',
                        placeholder: "Search program principles (e.g., 'amends' or 'humility')",
                        value: query,
                        onChange: (e) => setQuery(e.target.value),
                        onKeyPress: handleKeyPress,
                        className: 'flex-grow p-3 border border-gray-300 rounded-lg focus:border-purple-500 shadow-sm'
                    }),
                    React.createElement(
                        'button',
                        {
                            onClick: handleSearch,
                            className: 'bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-200'
                        },
                        React.createElement('svg', { className: 'w-5 h-5 inline-block', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                            React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z' })
                        )
                    )
                ),
                
                React.createElement(
                    'div',
                    { className: 'p-4 bg-purple-50 rounded-xl border border-purple-200 min-h-[100px] overflow-y-auto max-h-64 shadow-inner space-y-2' },
                    React.createElement(
                        'div',
                        { className: 'flex justify-between items-center' },
                        React.createElement('h4', { className: 'font-bold text-lg mb-1 text-purple-700' }, result.title),
                        React.createElement(ListenButton, { 
                            text: resultToSpeak, 
                            isSpeaking: isSpeaking, 
                            stopSpeaking: stopSpeaking, 
                            speakText: speakText 
                        })
                    ),
                    React.createElement('p', { className: 'text-gray-800 whitespace-pre-wrap mt-1 text-sm' }, result.content)
                ),

                React.createElement(LiteratureSelector, { 
                    literatureMap, 
                    literatureCategories, 
                    speakText, 
                    stopSpeaking, 
                    isSpeaking,
                    isLiteratureReady 
                })
            );
        };

        // Component for Check-in Log (Firestore Integration)
        const CheckinLog = ({ db, userId, isAuthReady, showAlert, isDbConfigured }) => {
            const [logEntries, setLogEntries] = useState([]);
            const [newEntryText, setNewEntryText] = useState('');
            
            const logCollectionPath = `artifacts/${appId}/users/${userId}/checkin_log`;

            useEffect(() => {
                if (!isAuthReady || !db || !userId || !isDbConfigured) return;
                
                const logRef = collection(db, logCollectionPath);
                
                const unsubscribe = onSnapshot(logRef, (snapshot) => {
                    const entries = [];
                    snapshot.forEach(doc => {
                        entries.push({ id: doc.id, ...doc.data() });
                    });
                    
                    entries.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    setLogEntries(entries);
                }, (error) => {
                    console.error("Error setting up log listener:", error);
                    showAlert("Failed to load log history. Check database connection/rules.", 'error');
                });

                return () => unsubscribe();
            }, [db, userId, isAuthReady, logCollectionPath, showAlert, isDbConfigured]);


            const handleSaveEntry = async () => {
                const text = newEntryText.trim();
                if (!text || !db || !userId) {
                    showAlert("Please write a message before saving. Log disabled if DB is not configured.", 'info');
                    return;
                }
                
                if (!isDbConfigured) {
                     showAlert("Log Functionality Disabled. Database is not available.", 'error');
                    return;
                }

                const newLogEntry = {
                    text: text,
                    timestamp: new Date(), 
                    userId: userId,
                };

                try {
                    await retry(() => addDoc(collection(db, logCollectionPath), newLogEntry));
                    setNewEntryText('');
                    showAlert("Check-in saved successfully!", 'success');
                } catch (error) {
                    console.error("Error saving check-in:", error);
                    showAlert(`Failed to save check-in. Error: ${error.message}. Check network/Firestore setup.`, 'error');
                }
            };

            const handleDeleteEntry = async (id) => {
                if (!db || !isDbConfigured) return;
                
                if (!window.confirm("Are you sure you want to delete this log entry?")) {
                    return;
                }
                
                try {
                    await retry(() => deleteDoc(doc(db, logCollectionPath, id)));
                    showAlert("Entry deleted.", 'success');
                } catch (error) {
                    console.error("Error deleting entry:", error);
                    showAlert(`Failed to delete entry. Error: ${error.message}`, 'error');
                }
            };
            
            if (!isAuthReady) {
                return React.createElement('div', { className: "text-center p-8 text-gray-500" }, "Initializing database connection...");
            }
            
            if (!isDbConfigured) {
                 return React.createElement('div', { className: "text-center p-8 text-red-500 font-medium bg-red-100 rounded-xl" }, 
                    "Log Functionality Disabled. Database is not available or failed to connect."
                );
            }

            return React.createElement(
                'div',
                { className: 'space-y-4' },
                React.createElement('h2', { className: 'text-2xl font-extrabold text-red-700 text-center border-b pb-3' }, 'Sponsor Check-in Log (Saved)'),
                
                React.createElement(
                    'div',
                    { className: 'bg-white p-4 rounded-xl shadow-lg border border-red-200' },
                    React.createElement('textarea', {
                        rows: '3',
                        placeholder: "Write down your thoughts, struggles, or gratitude for today, just as you would for your sponsor...",
                        value: newEntryText,
                        onChange: (e) => setNewEntryText(e.target.value),
                        className: 'w-full p-3 border border-gray-300 rounded-lg focus:border-red-500 transition duration-150 ease-in-out'
                    }),
                    React.createElement(
                        'button',
                        {
                            onClick: handleSaveEntry,
                            disabled: !db,
                            className: 'mt-3 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 disabled:opacity-50'
                        },
                        "Save Today's Check-in"
                    )
                ),

                React.createElement(
                    'div',
                    { className: 'bg-white p-4 rounded-xl shadow-lg max-h-80 overflow-y-auto custom-scrollbar border border-gray-200' },
                    React.createElement('h3', { className: 'text-xl font-semibold text-gray-700 mb-4 border-b pb-2' }, `History (${logEntries.length} Entries)`),
                    
                    logEntries.length === 0 ? (
                        React.createElement('p', { className: 'text-gray-500 italic' }, 'No entries saved yet. Your saved log will appear here.')
                    ) : (
                        React.createElement(
                            'ul',
                            { className: 'space-y-4' },
                            logEntries.map(entry => (
                                React.createElement(
                                    'li',
                                    { key: entry.id, className: 'border-b border-gray-100 pb-3 last:border-b-0' },
                                    React.createElement(
                                        'div',
                                        { className: 'flex justify-between items-start' },
                                        React.createElement(
                                            'p',
                                            { className: 'text-sm text-gray-500 font-medium' },
                                            entry.timestamp && new Date(entry.timestamp.seconds * 1000).toLocaleDateString(),
                                            ' - ',
                                            entry.timestamp && new Date(entry.timestamp.seconds * 1000).toLocaleTimeString()
                                        ),
                                        React.createElement(
                                            'button',
                                            {
                                                onClick: () => handleDeleteEntry(entry.id),
                                                className: 'text-gray-400 hover:text-red-500 transition p-1',
                                                title: 'Delete Entry'
                                            },
                                            React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', className: 'h-5 w-5', fill: 'none', viewBox: '0 0 24 24', stroke: 'currentColor' },
                                                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16' })
                                            )
                                        )
                                    ),
                                    React.createElement('p', { className: 'text-gray-800 whitespace-pre-wrap mt-1 text-sm' }, entry.text)
                                )
                            ))
                        )
                    )
                )
            );
        };


        // Main App Content Container
        const AppContent = ({ db, userId, isAuthReady, showAlert, isDbConfigured, speakText, stopSpeaking, isSpeaking, literatureMap, literatureCategories, isLiteratureReady }) => { 
            const [activeTab, setActiveTab] = useState('daily');

            const tabs = [
                { id: 'daily', name: 'Guidance', icon: (color) => React.createElement('svg', { className: `w-6 h-6 ${color}`, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M8 7v10l9 3 9-3V7l-9-3-9 3z' })) },
                { id: 'search', name: 'Reference', icon: (color) => React.createElement('svg', { className: `w-6 h-6 ${color}`, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z' })) },
                { id: 'log', name: 'Check-in', icon: (color) => React.createElement('svg', { className: `w-6 h-6 ${color}`, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z' })) },
            ];

            const renderContent = () => {
                switch (activeTab) {
                    case 'daily':
                        return React.createElement(DailyReadings, { speakText, stopSpeaking, isSpeaking });
                    case 'search':
                        return React.createElement(LiteratureSearch, {
                            literatureMap,
                            literatureCategories, 
                            isLiteratureReady,
                            speakText,
                            stopSpeaking,
                            isSpeaking
                        });
                    case 'log':
                        return React.createElement(CheckinLog, { db: db, userId: userId, isAuthReady: isAuthReady, showAlert: showAlert, isDbConfigured: isDbConfigured });
                    default:
                        return React.createElement(DailyReadings, { speakText, stopSpeaking, isSpeaking });
                }
            };
            
            useEffect(() => {
                stopSpeaking();
            }, [activeTab, stopSpeaking]);


            return React.createElement(
                'div',
                { className: 'flex flex-col h-full bg-gray-50' },
                
                React.createElement(
                    'header',
                    { className: 'bg-white border-b border-gray-200 shadow-lg' },
                    React.createElement(
                        'div',
                        { className: 'flex justify-around items-center p-1 sm:p-2' },
                        tabs.map(tab => (
                            React.createElement(
                                'button',
                                {
                                    key: tab.id,
                                    onClick: () => setActiveTab(tab.id),
                                    className: `flex flex-col items-center py-2 px-3 text-sm font-semibold transition-all duration-200 rounded-lg ${
                                        activeTab === tab.id
                                            ? 'text-indigo-700 bg-indigo-100/50'
                                            : 'text-gray-500 hover:text-indigo-600 hover:bg-gray-50'
                                    }`
                                },
                                tab.icon(activeTab === tab.id ? 'text-indigo-600' : 'text-gray-400'),
                                React.createElement('span', { className: 'mt-1 text-xs' }, tab.name)
                            )
                        ))
                    )
                ),

                React.createElement(
                    'main',
                    { className: 'flex-grow overflow-y-auto p-4 custom-scrollbar' },
                    renderContent()
                ),
                
                React.createElement(
                    'footer',
                    { className: 'bg-indigo-700 text-white p-2 text-center text-xs font-light' },
                    'NA Companion | Recovery is a journey. Keep coming back.'
                )
            );
        };


        function App() {
            const { db, userId, isAuthReady, isDbConfigured } = useFirebase();
            const { speakText, isSpeaking, stopSpeaking } = useWebSpeech();
            const [alertMessage, setAlertMessage] = useState(null);
            const [alertType, setAlertType] = useState('info');

            const showAlert = useCallback((message, type = 'info') => {
                setAlertMessage(message);
                setAlertType(type);
            }, []);
            
            // Sync literature data only after DB is configured
            const { literatureMap, literatureCategories, isLiteratureReady } = useLiteratureSync(db, isDbConfigured, showAlert); 


            const handleAlertClose = useCallback(() => {
                setAlertMessage(null);
            }, []);
            
            const displayUserId = isDbConfigured && userId
                ? userId 
                : 'Offline/Anonymous';


            return React.createElement(
                'div',
                { className: 'min-h-screen bg-gray-100 flex justify-center p-0 sm:p-4' },
                React.createElement(Alert, { message: alertMessage, type: alertType, onClose: handleAlertClose }),
                
                React.createElement(
                    'div',
                    { className: 'w-full max-w-lg border-4 border-gray-900 bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-screen sm:h-[90vh] sm:min-h-[700px]' },
                    
                    React.createElement(
                        'div',
                        { className: 'bg-indigo-800 text-white p-4 flex justify-between items-center shadow-xl' },
                        React.createElement(
                            'h1',
                            { className: 'text-2xl font-extrabold flex items-center' },
                            React.createElement('svg', { className: 'w-7 h-7 mr-2', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M4 7v10l9 3 9-3V7l-9-3-9 3z' })
                            ),
                            'NA Companion'
                        ),
                        React.createElement(
                            'span',
                            { className: 'text-xs text-indigo-300 italic' },
                            'User ID: ',
                            displayUserId
                        )
                    ),

                    React.createElement(AppContent, { 
                        db: db, 
                        userId: userId, 
                        isAuthReady: isAuthReady, 
                        showAlert: showAlert,
                        isDbConfigured: isDbConfigured,
                        speakText: speakText,
                        stopSpeaking: stopSpeaking,
                        isSpeaking: isSpeaking,
                        literatureMap: literatureMap,
                        literatureCategories: literatureCategories, 
                        isLiteratureReady: isLiteratureReady
                    })
                )
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</body>
</html>
