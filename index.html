<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NA Companion - Daily Guidance</title>
    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Load React and ReactDOM as GLOBAL variables using standard script tags. -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <style>
        /* Apply the Inter font globally */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for better mobile/desktop appearance */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="module">
        // --- 1. React Hook Definitions (Accessed from global React object) ---
        // We extract hooks from the globally loaded React object
        const { useState, useEffect, useCallback, useMemo } = React;
        
        // Firebase ES Module Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, deleteDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 2. Global Firebase Configuration and Utility Functions ---

        // MANDATORY GLOBAL VARIABLES from the Canvas Environment
        // Check if global __firebase_config is defined; if not, use a default placeholder.
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "PLACEHOLDER_KEY",
            projectId: "PLACEHOLDER_ID",
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // Utility function for exponential backoff on fetch/Firebase retries
        const retry = async (fn, retries = 5, delay = 1000) => {
            for (let i = 0; i < retries; i++) {
                try {
                    return await fn();
                } catch (error) {
                    if (i === retries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, i)));
                }
            }
        };

        // --- 3. Embedded Literature Data ---

        const dailyReflections = [
            "JFT: Our common welfare should come first; personal recovery depends on NA unity and focusing on the group's primary purpose.",
            "JFT: When we were using, we tried to change the world to make it tolerable. Now, we change ourselves through the Twelve Steps, starting with acceptance.",
            "JFT: We admitted that we were powerless over our addiction, that our lives had become unmanageable. This admission is the bedrock of all freedom.",
            "JFT: It is impossible to practice honesty in a vacuum. We must be rigorously honest with a sponsor, our Higher Power, and ourselves to grow.",
            "JFT: We may not always be able to control what happens, but we can control our attitude about it by practicing the principle of willingness.",
            "JFT: The greatest gift of recovery is the sense of belonging we find in the fellowship, replacing isolation with connection and love.",
        ];

        const dailyMeditations = [
            "Today's Meditation: Humility is not thinking less of yourself, but thinking of yourself less. Seek to be helpful, not always right.",
            "Today's Meditation: Courage is required to change. We face our fears with the knowledge that we are not alone; our HP is with us.",
            "Today's Meditation: The promise of the program is freedom. This freedom is maintained by continuous spiritual maintenance—Steps Ten, Eleven, and Twelve.",
            "Today's Meditation: Acceptance allows us to live on life's terms. When we stop fighting reality, we can find peace in the present moment.",
            "Today's Meditation: Gratitude turns what we have into enough. Start the day by listing three things you are truly grateful for in your life today.",
            "Today's Meditation: Service is the backbone of the program. What act of selfless service can I perform for another addict today?",
        ];

        // COMBINED LITERATURE DATA STRUCTURE
        const naLiterature = {
            'Chapter 1: Who Is an Addict?': 
                "This foundational chapter defines addiction as a progressive, chronic, and fatal disease. It focuses on the crucial admission of powerlessness and unmanageability (Step One), emphasizing that addiction is a total condition—physical, mental, and spiritual—requiring a complete change in lifestyle. It sets the stage for surrender and the need for the program.",
            'Chapter 2: What Is the Narcotics Anonymous Program?': 
                "This chapter introduces the NA Fellowship, describing it as a non-profit fellowship of men and women for whom drugs had become a major problem. It explains that the program is a set of spiritual principles (the 12 Steps) that, when practiced, allow the addict to recover from the disease of addiction. It emphasizes that NA has no opinion on outside issues and is based on attraction, not promotion.",
            'Chapter 3: We Do Recover': 
                "This chapter offers hope and strength by sharing personal stories that prove recovery is possible. It illustrates the destructive nature of addiction and the transformative power of the Twelve Steps. It reassures newcomers that they are not alone and encourages them to stick with the program, highlighting the changes experienced in sobriety.",
            'Chapter 4: The Fellowship of Narcotics Anonymous': 
                "This chapter details the importance of the group as a whole. It describes the group as the primary tool for carrying the message to the still-suffering addict. It discusses the atmosphere of acceptance, the role of sponsorship, and the function of NA meetings. It grounds the individual in the shared experience of the fellowship.",
            'Chapter 5: How It Works': 
                "This chapter provides a concise, direct explanation of the NA program's core mechanism. It outlines the 'Three Essentials' for recovery: honesty, open-mindedness, and willingness. It emphasizes that complete abstinence from all drugs is necessary, and that the program is about applying spiritual principles to all areas of life.",
            'Chapter 6: Tradition One': 
                "Dedicated entirely to the First Tradition, this chapter explains why 'Our common welfare should come first; personal recovery depends on NA unity' is paramount. It delves into the concept of unity being the foundation upon which the group and individual recovery stand, protecting the atmosphere necessary for the message to be heard.",
            'Chapter 7: The Twelve Steps': 
                "This extensive chapter offers a detailed, in-depth exploration of the action and principles behind each of the Twelve Steps (Steps 1 through 12). It serves as the primary instruction manual for working the steps, emphasizing the spiritual nature of the process and the necessity of finding a Power greater than ourselves.",
            'Chapter 8: The Twelve Traditions': 
                "This chapter details the remaining eleven Traditions, explaining the principles of unity, service, non-affiliation, and finance that guide the NA group structure. The Traditions are presented as guidelines to ensure the group's survival and its ability to carry the message freely, without being diverted by outside issues.",
            'Chapter 9: The Twelve Concepts': 
                "This chapter, often less focused on individual recovery, is critical for service structure. It outlines the twelve guiding principles for NA's worldwide service efforts, ensuring leadership by rotating servants and accountability, ultimately preserving the purity of the NA message.",
            'Chapter 10: Just For Today': 
                "This final chapter focuses on applying the program principles to daily life through the practice of living 'Just for Today.' It encourages members to focus on the present moment, practicing the Steps daily, managing feelings, and maintaining a spiritual condition to prevent relapse and build a sustainable recovery.",
            'NA Symbol': "The symbol represents simplicity and the path to Freedom. The square base denotes Good will and Service. The four pyramid sides rising from the base represent Self, Society, Service, and God, all culminating at the point of Freedom from active addiction.",
            'It Works How and Why': 
                "This literature provides deeper insight into the principles of the Twelve Steps and the Twelve Traditions. It emphasizes that the Steps are not sequential tasks, but continuous attitudes to be lived, focusing on the practical application of spiritual principles (like faith, honesty, and humility) to our daily lives.",
            'NA Step Working Guide': 
                "This tool provides direct, practical exercises and questions for each of the Twelve Steps. It is a structured guide for self-examination, promoting meticulous honesty and action to help members move through the Steps thoroughly to achieve a spiritual awakening.",
        };

        // --- 4. Custom Hooks ---

        // Custom Hook for Web Speech API (TTS)
        const useWebSpeech = () => {
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [preferredVoice, setPreferredVoice] = useState(null);

            // 1. Load voices once and on change
            useEffect(() => {
                if (!window.speechSynthesis) return;

                const loadVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    // Try to find a clear English voice (Google voices are often higher quality)
                    const voice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.default));
                    setPreferredVoice(voice || null);
                };

                // Load immediately if voices are already available
                loadVoices();

                // Listener for asynchronous voice loading (required for some browsers)
                window.speechSynthesis.onvoiceschanged = loadVoices;

                return () => {
                    window.speechSynthesis.onvoiceschanged = null;
                };
            }, []);

            const stopSpeaking = useCallback(() => {
                if (window.speechSynthesis && window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                }
            }, []);

            const speakText = useCallback((text) => {
                if (!window.speechSynthesis) {
                    console.error("Browser does not support Web Speech Synthesis API.");
                    return;
                }
                
                // Always cancel previous speech before starting a new one
                stopSpeaking(); 

                if (!text) return;

                const utterance = new SpeechSynthesisUtterance(text);
                
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }
                
                utterance.rate = 1.0; 
                utterance.pitch = 1.0; 

                // Consolidated handler to ensure isSpeaking is reset on end or error
                const handleEndOrError = (event) => {
                    // Log critical errors but treat 'interrupted' as a clean stop
                    if (event.error && event.error !== 'interrupted') {
                         console.error('Speech Synthesis Critical Error:', event.error);
                    }
                    setIsSpeaking(false); 
                };
                
                // Assign handlers
                utterance.onstart = () => setIsSpeaking(true);
                utterance.onend = handleEndOrError;
                utterance.onerror = handleEndOrError; // Crucially handles the 'interrupted' error by resetting state

                window.speechSynthesis.speak(utterance);
            }, [stopSpeaking, preferredVoice]);
            
            // Cleanup on component unmount
            useEffect(() => {
                return () => {
                    stopSpeaking();
                };
            }, [stopSpeaking]);

            return { speakText, isSpeaking, stopSpeaking };
        };

        // Custom Hook for Firebase Initialization and Authentication
        const useFirebase = () => {
            const [db, setDb] = useState(null);
            const [userId, setUserId] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [isDbConfigured, setIsDbConfigured] = useState(false);
            
            // Check if we are running in an environment where Firebase configuration is provided
            const isConfigValid = useMemo(() => {
                return typeof firebaseConfig.projectId === 'string' && firebaseConfig.projectId !== 'PLACEHOLDER_ID';
            }, [firebaseConfig]);


            useEffect(() => {
                
                if (!isConfigValid) {
                    console.warn("Firebase config is missing or using placeholder. Log functionality is disabled.");
                    setIsAuthReady(true);
                    setIsDbConfigured(false);
                    return;
                }
                
                // Set debug level for detailed logging
                setLogLevel('debug');
                setIsDbConfigured(true);

                const setupFirebase = async () => {
                    try {
                        const app = initializeApp(firebaseConfig);
                        const firestore = getFirestore(app);
                        const firebaseAuth = getAuth(app);
                        setDb(firestore);
                        
                        // Set persistence to session to avoid re-auth on every page load
                        await setPersistence(firebaseAuth, browserSessionPersistence);


                        const unsubscribe = onAuthStateChanged(firebaseAuth, async (user) => {
                            if (user) {
                                setUserId(user.uid);
                            } else {
                                // Attempt initial sign-in
                                try {
                                    if (initialAuthToken) {
                                        await retry(() => signInWithCustomToken(firebaseAuth, initialAuthToken));
                                    } else {
                                        await retry(() => signInAnonymously(firebaseAuth));
                                    }
                                    setUserId(firebaseAuth.currentUser.uid);
                                } catch (error) {
                                    console.error("Firebase Auth failed, using random ID for non-persistent access:", error);
                                    // Fallback to random ID if auth fails, allowing the app to run without DB access.
                                    setUserId(crypto.randomUUID()); 
                                    setIsDbConfigured(false); // Disable log function if auth fails
                                }
                            }
                            setIsAuthReady(true);
                        });

                        return () => unsubscribe();
                    } catch (e) {
                        console.error("Error initializing Firebase services:", e);
                        setIsAuthReady(true);
                        setIsDbConfigured(false);
                    }
                };

                // Execute setup function
                setupFirebase();
            }, [isConfigValid, initialAuthToken]); 

            return { db, userId, isAuthReady, isDbConfigured };
        };

        // Component to display messages/alerts instead of using alert()
        const Alert = ({ message, type, onClose }) => {
            if (!message) return null;

            const baseStyle = "p-3 text-sm rounded-lg fixed top-2 left-1/2 -translate-x-1/2 z-50 shadow-xl max-w-sm w-11/12 transition-all duration-300 transform";
            let colorStyle = "";

            switch (type) {
                case 'success':
                    colorStyle = "bg-green-100 text-green-800 border border-green-200";
                    break;
                case 'error':
                    colorStyle = "bg-red-100 text-red-800 border border-red-200";
                    break;
                default:
                    colorStyle = "bg-blue-100 text-blue-800 border border-blue-200";
            }

            useEffect(() => {
                const timer = setTimeout(() => {
                    onClose();
                }, 4000); 

                return () => clearTimeout(timer);
            }, [message, onClose]);

            return React.createElement(
                'div',
                { className: `${baseStyle} ${colorStyle}`, role: 'alert' },
                React.createElement(
                    'span',
                    { className: 'font-medium' },
                    type.toUpperCase(),
                    ': '
                ),
                ' ',
                message
            );
        };

        // --- 5. React Components (TTS Integrated) ---

        const ListenButton = ({ text, isSpeaking, stopSpeaking, speakText }) => {
            const handleToggle = () => {
                if (isSpeaking) {
                    stopSpeaking();
                } else {
                    speakText(text);
                }
            };

            return React.createElement(
                'button',
                {
                    onClick: handleToggle,
                    className: `ml-auto flex items-center px-3 py-1 text-xs font-semibold rounded-full transition duration-150 ${
                        isSpeaking
                            ? 'bg-red-500 hover:bg-red-600 text-white shadow-md'
                            : 'bg-indigo-200 hover:bg-indigo-300 text-indigo-800'
                    }`
                },
                React.createElement('svg', { 
                    className: `w-4 h-4 mr-1 ${isSpeaking ? 'animate-pulse' : ''}`, 
                    fill: 'none', 
                    stroke: 'currentColor', 
                    viewBox: '0 0 24 24' 
                },
                    isSpeaking 
                        ? React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z' }) // Stop icon
                        : React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M15.536 8.464l-4.536 4.536L8.464 15.536a2 2 0 01-2.828-2.828l4.536-4.536L15.536 8.464z' }) // Listen icon (play/speaker)
                ),
                isSpeaking ? 'Stop' : 'Listen'
            );
        };


        // Component for Daily Readings
        const DailyReadings = ({ speakText, stopSpeaking, isSpeaking }) => {
            const getDailyText = useCallback((dataArray) => {
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 0);
                const diff = now - start;
                const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
                const index = dayOfYear % dataArray.length;
                return dataArray[index];
            }, []);

            const reflection = useMemo(() => getDailyText(dailyReflections), [getDailyText]);
            const meditation = useMemo(() => getDailyText(dailyMeditations), [getDailyText]);
            
            // Text to speak (cleaned up)
            const reflectionText = reflection.replace('JFT: ', 'Just For Today: ');
            const meditationText = meditation.replace("Today's Meditation: ", 'Daily Meditation: ');

            // Using React.createElement 
            return React.createElement(
                'div',
                { className: 'space-y-6' },
                React.createElement(
                    'h2',
                    { className: 'text-2xl font-extrabold text-emerald-700 text-center border-b pb-3' },
                    'Daily Guidance'
                ),
                // JFT Card
                React.createElement(
                    'div',
                    { className: 'bg-emerald-50 border-l-4 border-emerald-500 rounded-xl p-5 shadow-xl transition hover:shadow-2xl space-y-3' },
                    React.createElement(
                        'div',
                        { className: 'flex items-center justify-between' },
                        React.createElement(
                            'p',
                            { className: 'font-bold text-emerald-700 text-xl flex items-center' },
                            React.createElement('svg', { className: 'w-6 h-6 mr-2', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z' })
                            ),
                            'Just For Today'
                        ),
                        React.createElement(ListenButton, { 
                            text: reflectionText, 
                            isSpeaking: isSpeaking, 
                            stopSpeaking: stopSpeaking, 
                            speakText: speakText 
                        })
                    ),
                    React.createElement(
                        'p',
                        { className: 'text-gray-700 italic leading-relaxed' },
                        reflection.replace('JFT: ', '')
                    )
                ),
                // Meditation Card
                React.createElement(
                    'div',
                    { className: 'bg-blue-50 border-l-4 border-blue-500 rounded-xl p-5 shadow-xl transition hover:shadow-2xl space-y-3' },
                    React.createElement(
                        'div',
                        { className: 'flex items-center justify-between' },
                        React.createElement(
                            'p',
                            { className: 'font-bold text-blue-700 text-xl flex items-center' },
                            React.createElement('svg', { className: 'w-6 h-6 mr-2', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M16 4v12l-4-2-4 2V4M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z' })
                            ),
                            'Daily Meditation'
                        ),
                        React.createElement(ListenButton, { 
                            text: meditationText, 
                            isSpeaking: isSpeaking, 
                            stopSpeaking: stopSpeaking, 
                            speakText: speakText 
                        })
                    ),
                    React.createElement(
                        'p',
                        { className: 'text-gray-700 italic leading-relaxed' },
                        meditation.replace("Today's Meditation: ", '')
                    )
                )
            );
        };

        // Component for Navigating the Full Literature
        const LiteratureSelector = ({ speakText, stopSpeaking, isSpeaking }) => {
            const [selectedKey, setSelectedKey] = useState(Object.keys(naLiterature)[0]);
            
            // Structure keys for clean display in a mobile list
            const literatureKeys = useMemo(() => {
                const allKeys = Object.keys(naLiterature);
                const structure = [
                    { label: '--- NA Basic Text Chapters (1-10) ---', keys: allKeys.filter(k => k.startsWith('Chapter')).sort((a, b) => parseInt(a.slice(8)) - parseInt(b.slice(8))) },
                    { label: '--- Other Core Literature & Tools ---', keys: ['NA Symbol', 'It Works How and Why', 'NA Step Working Guide'] },
                ];
                return structure;
            }, []);
            
            const currentContent = naLiterature[selectedKey] || '';
            const contentToSpeak = `${selectedKey}. ${currentContent}`;

            // Using React.createElement 
            return React.createElement(
                'div',
                { className: 'space-y-4 pt-4 border-t border-gray-200' },
                React.createElement('h3', { className: 'text-xl font-bold text-gray-700' }, 'Full Literature Reference'),
                
                React.createElement(
                    'select',
                    {
                        onChange: (e) => setSelectedKey(e.target.value),
                        value: selectedKey,
                        className: 'w-full p-3 border border-gray-300 rounded-lg bg-white shadow-sm focus:border-indigo-500 text-gray-700'
                    },
                    literatureKeys.map((section, index) => (
                        React.createElement(
                            React.Fragment,
                            { key: index },
                            React.createElement(
                                'option',
                                { value: "", disabled: true, className: 'font-bold bg-gray-100' },
                                section.label
                            ),
                            section.keys.map(key => (
                                React.createElement(
                                    'option',
                                    { key: key, value: key, className: 'text-gray-800' },
                                    key
                                )
                            ))
                        )
                    ))
                ),
                
                React.createElement(
                    'div',
                    { className: 'p-4 bg-gray-50 rounded-xl border border-gray-200 max-h-96 overflow-y-auto custom-scrollbar' },
                    React.createElement(
                        'div',
                        { className: 'flex justify-between items-center mb-2' },
                        React.createElement('h4', { className: 'font-bold text-lg text-indigo-700' }, selectedKey),
                        React.createElement(ListenButton, { 
                            text: contentToSpeak, 
                            isSpeaking: isSpeaking, 
                            stopSpeaking: stopSpeaking, 
                            speakText: speakText 
                        })
                    ),
                    React.createElement('p', { className: 'text-gray-800 whitespace-pre-wrap mt-1 text-sm' }, currentContent)
                )
            );
        };

        // Component for Offline Literature Search
        const LiteratureSearch = ({ speakText, stopSpeaking, isSpeaking }) => {
            const [query, setQuery] = useState('');
            const [result, setResult] = useState({ title: 'Welcome', content: 'Enter a word or principle (e.g., "amends," "powerless," "unity," or "Step 10") to search the embedded literature.' });
            
            const resultToSpeak = `${result.title}. ${result.content}`;

            // Finds the most relevant literature entry based on a keyword/phrase using client-side full-text search.
            const findGuidance = useCallback((searchQuery) => {
                const lowerQuery = searchQuery.toLowerCase().trim();

                if (!lowerQuery || lowerQuery.length < 3) {
                     return { title: "Search Query Too Short", content: "Please enter a word or phrase with at least 3 letters to search the embedded literature." };
                }
                
                // 1. Full-text search across all stored literature (most comprehensive)
                let bestMatch = null;
                let highestCount = 0;

                for (const title in naLiterature) {
                    const content = naLiterature[title];
                    const lowerContent = content.toLowerCase();

                    if (lowerContent.includes(lowerQuery)) {
                        const count = (lowerContent.match(new RegExp(lowerQuery, 'g')) || []).length;

                        if (count > highestCount || !bestMatch) {
                            highestCount = count;
                            
                            // Extract a snippet for context
                            const matchIndex = lowerContent.indexOf(lowerQuery);
                            const startIndex = Math.max(0, matchIndex - 80); 
                            const endIndex = Math.min(content.length, matchIndex + lowerQuery.length + 80);
                            
                            let snippet = content.substring(startIndex, endIndex).trim();
                            
                            if (startIndex > 0) snippet = '... ' + snippet;
                            if (endIndex < content.length) snippet = snippet + ' ...';

                            bestMatch = { 
                                title: `Excerpt from: ${title} (Matches: ${count})`, 
                                content: `"${snippet}"\n\n(Found using the term: "${searchQuery}")` 
                            };
                        }
                    }
                }

                if (bestMatch) {
                    return bestMatch;
                }

                // 2. Default / Not Found
                return { 
                    title: "No Excerpt Found", 
                    content: `The search term "${searchQuery}" did not appear in the currently embedded literature excerpts. Try searching for a core program principle.`
                };
            }, []);

            const handleSearch = () => {
                if (query) {
                    const searchResult = findGuidance(query);
                    setResult(searchResult);
                    stopSpeaking(); // Stop any current speech when search result changes
                }
            };
            
            const handleKeyPress = (e) => {
                if (e.key === 'Enter') {
                    handleSearch();
                }
            };

            // Using React.createElement 
            return React.createElement(
                'div',
                { className: 'space-y-4' },
                React.createElement('h2', { className: 'text-2xl font-extrabold text-purple-700 text-center border-b pb-3' }, 'Virtual Sponsor Search'),
                React.createElement(
                    'div',
                    { className: 'flex gap-3' },
                    React.createElement('input', {
                        type: 'text',
                        placeholder: "Search program principles (e.g., 'amends' or 'unity')",
                        value: query,
                        onChange: (e) => setQuery(e.target.value),
                        onKeyPress: handleKeyPress,
                        className: 'flex-grow p-3 border border-gray-300 rounded-lg focus:border-purple-500 shadow-sm'
                    }),
                    React.createElement(
                        'button',
                        {
                            onClick: handleSearch,
                            className: 'bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-200'
                        },
                        React.createElement('svg', { className: 'w-5 h-5 inline-block', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                            React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z' })
                        )
                    )
                ),
                
                React.createElement(
                    'div',
                    { className: 'p-4 bg-purple-50 rounded-xl border border-purple-200 min-h-[100px] overflow-y-auto max-h-64 shadow-inner space-y-2' },
                    React.createElement(
                        'div',
                        { className: 'flex justify-between items-center' },
                        React.createElement('h4', { className: 'font-bold text-lg mb-1 text-purple-700' }, result.title),
                        React.createElement(ListenButton, { 
                            text: resultToSpeak, 
                            isSpeaking: isSpeaking, 
                            stopSpeaking: stopSpeaking, 
                            speakText: speakText 
                        })
                    ),
                    React.createElement('p', { className: 'text-gray-800 whitespace-pre-wrap text-sm' }, result.content)
                ),

                React.createElement(LiteratureSelector, { speakText, stopSpeaking, isSpeaking })
            );
        };

        // Component for Check-in Log (Firestore Integration)
        const CheckinLog = ({ db, userId, isAuthReady, showAlert, isDbConfigured }) => {
            const [logEntries, setLogEntries] = useState([]);
            const [newEntryText, setNewEntryText] = useState('');
            
            // Use the private path for user data
            const logCollectionPath = `artifacts/${appId}/users/${userId}/checkin_log`;

            // 1. Fetch data with real-time listener
            useEffect(() => {
                // IMPORTANT GUARD CLAUSE: Only run if auth is ready and DB is configured/accessible
                if (!isAuthReady || !db || !userId || !isDbConfigured) return;
                
                const logRef = collection(db, logCollectionPath);
                
                // Use onSnapshot to listen for real-time updates
                const unsubscribe = onSnapshot(logRef, (snapshot) => {
                    const entries = [];
                    snapshot.forEach(doc => {
                        entries.push({ id: doc.id, ...doc.data() });
                    });
                    // Sort client-side by timestamp descending (newest first)
                    // We check for the structure of the Firestore Timestamp object
                    entries.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                    setLogEntries(entries);
                }, (error) => {
                    console.error("Error setting up log listener:", error);
                    showAlert("Failed to load log history. Check database connection/rules.", 'error');
                });

                return () => unsubscribe();
            }, [db, userId, isAuthReady, logCollectionPath, showAlert, isDbConfigured]);


            // 2. Save New Entry
            const handleSaveEntry = async () => {
                const text = newEntryText.trim();
                if (!text || !db || !userId) {
                    showAlert("Please write a message before saving. Log disabled if DB is not configured.", 'info');
                    return;
                }
                
                if (!isDbConfigured) {
                     showAlert("Log Functionality Disabled. Database is not available.", 'error');
                    return;
                }

                const newLogEntry = {
                    text: text,
                    timestamp: new Date(), // Firestore automatically converts Date objects
                    userId: userId,
                };

                try {
                    await retry(() => addDoc(collection(db, logCollectionPath), newLogEntry));
                    setNewEntryText('');
                    showAlert("Check-in saved successfully!", 'success');
                } catch (error) {
                    console.error("Error saving check-in:", error);
                    showAlert(`Failed to save check-in. Error: ${error.message}. Check network/Firestore setup.`, 'error');
                }
            };

            // 3. Delete Entry 
            const handleDeleteEntry = async (id) => {
                if (!db || !isDbConfigured) return;
                
                // Use a custom confirmation modal in production apps, but standard browser confirm for this example
                if (!window.confirm("Are you sure you want to delete this log entry?")) {
                    return;
                }
                
                try {
                    await retry(() => deleteDoc(doc(db, logCollectionPath, id)));
                    showAlert("Entry deleted.", 'success');
                } catch (error) {
                    console.error("Error deleting entry:", error);
                    showAlert(`Failed to delete entry. Error: ${error.message}`, 'error');
                }
            };
            
            // Loading State
            if (!isAuthReady) {
                return React.createElement('div', { className: "text-center p-8 text-gray-500" }, "Initializing database connection...");
            }
            
            // Check if Firebase is configured
            if (!isDbConfigured) {
                 return React.createElement('div', { className: "text-center p-8 text-red-500 font-medium bg-red-100 rounded-xl" }, 
                    "Log Functionality Disabled. Database is not available or failed to connect."
                );
            }

            // Using React.createElement 
            return React.createElement(
                'div',
                { className: 'space-y-4' },
                React.createElement('h2', { className: 'text-2xl font-extrabold text-red-700 text-center border-b pb-3' }, 'Sponsor Check-in Log (Saved)'),
                
                // Input Area
                React.createElement(
                    'div',
                    { className: 'bg-white p-4 rounded-xl shadow-lg border border-red-200' },
                    React.createElement('textarea', {
                        rows: '3',
                        placeholder: "Write down your thoughts, struggles, or gratitude for today, just as you would for your sponsor...",
                        value: newEntryText,
                        onChange: (e) => setNewEntryText(e.target.value),
                        className: 'w-full p-3 border border-gray-300 rounded-lg focus:border-red-500 transition duration-150 ease-in-out'
                    }),
                    React.createElement(
                        'button',
                        {
                            onClick: handleSaveEntry,
                            disabled: !db,
                            className: 'mt-3 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200 disabled:opacity-50'
                        },
                        "Save Today's Check-in"
                    )
                ),

                // History Area
                React.createElement(
                    'div',
                    { className: 'bg-white p-4 rounded-xl shadow-lg max-h-80 overflow-y-auto custom-scrollbar border border-gray-200' },
                    React.createElement('h3', { className: 'text-xl font-semibold text-gray-700 mb-4 border-b pb-2' }, `History (${logEntries.length} Entries)`),
                    
                    logEntries.length === 0 ? (
                        React.createElement('p', { className: 'text-gray-500 italic' }, 'No entries saved yet. Your saved log will appear here.')
                    ) : (
                        React.createElement(
                            'ul',
                            { className: 'space-y-4' },
                            logEntries.map(entry => (
                                React.createElement(
                                    'li',
                                    { key: entry.id, className: 'border-b border-gray-100 pb-3 last:border-b-0' },
                                    React.createElement(
                                        'div',
                                        { className: 'flex justify-between items-start' },
                                        React.createElement(
                                            'p',
                                            { className: 'text-sm text-gray-500 font-medium' },
                                            entry.timestamp && new Date(entry.timestamp.seconds * 1000).toLocaleDateString(),
                                            ' - ',
                                            entry.timestamp && new Date(entry.timestamp.seconds * 1000).toLocaleTimeString()
                                        ),
                                        React.createElement(
                                            'button',
                                            {
                                                onClick: () => handleDeleteEntry(entry.id),
                                                className: 'text-gray-400 hover:text-red-500 transition p-1',
                                                title: 'Delete Entry'
                                            },
                                            React.createElement('svg', { xmlns: 'http://www.w3.org/2000/svg', className: 'h-5 w-5', fill: 'none', viewBox: '0 0 24 24', stroke: 'currentColor' },
                                                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16' })
                                            )
                                        )
                                    ),
                                    React.createElement('p', { className: 'text-gray-800 whitespace-pre-wrap mt-1 text-sm' }, entry.text)
                                )
                            ))
                        )
                    )
                )
            );
        };


        // Main App Content Container
        const AppContent = ({ db, userId, isAuthReady, showAlert, isDbConfigured, speakText, stopSpeaking, isSpeaking }) => {
            const [activeTab, setActiveTab] = useState('daily');

            const tabs = [
                { id: 'daily', name: 'Guidance', icon: (color) => React.createElement('svg', { className: `w-6 h-6 ${color}`, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M8 7v10l9 3 9-3V7l-9-3-9 3z' })) },
                { id: 'search', name: 'Reference', icon: (color) => React.createElement('svg', { className: `w-6 h-6 ${color}`, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z' })) },
                { id: 'log', name: 'Check-in', icon: (color) => React.createElement('svg', { className: `w-6 h-6 ${color}`, fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z' })) },
            ];

            const renderContent = () => {
                switch (activeTab) {
                    case 'daily':
                        return React.createElement(DailyReadings, { speakText, stopSpeaking, isSpeaking });
                    case 'search':
                        return React.createElement(LiteratureSearch, { speakText, stopSpeaking, isSpeaking });
                    case 'log':
                        // Log does not require TTS props
                        return React.createElement(CheckinLog, { db: db, userId: userId, isAuthReady: isAuthReady, showAlert: showAlert, isDbConfigured: isDbConfigured });
                    default:
                        return React.createElement(DailyReadings, { speakText, stopSpeaking, isSpeaking });
                }
            };
            
            // Stop speaking if the tab changes
            useEffect(() => {
                stopSpeaking();
            }, [activeTab, stopSpeaking]);


            // Using React.createElement 
            return React.createElement(
                'div',
                { className: 'flex flex-col h-full bg-gray-50' },
                
                // Header / Tab Navigation
                React.createElement(
                    'header',
                    { className: 'bg-white border-b border-gray-200 shadow-lg' },
                    React.createElement(
                        'div',
                        { className: 'flex justify-around items-center p-1 sm:p-2' },
                        tabs.map(tab => (
                            React.createElement(
                                'button',
                                {
                                    key: tab.id,
                                    onClick: () => setActiveTab(tab.id),
                                    className: `flex flex-col items-center py-2 px-3 text-sm font-semibold transition-all duration-200 rounded-lg ${
                                        activeTab === tab.id
                                            ? 'text-indigo-700 bg-indigo-100/50'
                                            : 'text-gray-500 hover:text-indigo-600 hover:bg-gray-50'
                                    }`
                                },
                                tab.icon(activeTab === tab.id ? 'text-indigo-600' : 'text-gray-400'),
                                React.createElement('span', { className: 'mt-1 text-xs' }, tab.name)
                            )
                        ))
                    )
                ),

                // Main Scrollable Content
                React.createElement(
                    'main',
                    { className: 'flex-grow overflow-y-auto p-4 custom-scrollbar' },
                    renderContent()
                ),
                
                // Info Footer
                React.createElement(
                    'footer',
                    { className: 'bg-indigo-700 text-white p-2 text-center text-xs font-light' },
                    'NA Companion | Recovery is a journey. Keep coming back.'
                )
            );
        };


        // Main App Component with Mobile Styling and Layout
        function App() {
            const { db, userId, isAuthReady, isDbConfigured } = useFirebase();
            const { speakText, isSpeaking, stopSpeaking } = useWebSpeech();
            const [alertMessage, setAlertMessage] = useState(null);
            const [alertType, setAlertType] = useState('info');

            const showAlert = useCallback((message, type = 'info') => {
                setAlertMessage(message);
                setAlertType(type);
            }, []);

            const handleAlertClose = useCallback(() => {
                setAlertMessage(null);
            }, []);
            
            // Safety check for substring access: use the full ID if not yet initialized, but display 'Connecting...'
            // Display the full userId if configured, otherwise show a generic message.
            const displayUserId = isDbConfigured && userId
                ? userId 
                : 'Offline/Anonymous';


            // Using React.createElement 
            return React.createElement(
                'div',
                { className: 'min-h-screen bg-gray-100 flex justify-center p-0 sm:p-4' },
                React.createElement(Alert, { message: alertMessage, type: alertType, onClose: handleAlertClose }),
                
                // Mobile Device Frame for Android aesthetic
                React.createElement(
                    'div',
                    { className: 'w-full max-w-lg border-4 border-gray-900 bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col min-h-screen sm:h-[90vh] sm:min-h-[700px]' },
                    
                    // App Title Bar (Android Style)
                    React.createElement(
                        'div',
                        { className: 'bg-indigo-800 text-white p-4 flex justify-between items-center shadow-xl' },
                        React.createElement(
                            'h1',
                            { className: 'text-2xl font-extrabold flex items-center' },
                            React.createElement('svg', { className: 'w-7 h-7 mr-2', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' },
                                React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: '2', d: 'M4 7v10l9 3 9-3V7l-9-3-9 3z' })
                            ),
                            'NA Companion'
                        ),
                        React.createElement(
                            'span',
                            { className: 'text-xs text-indigo-300 italic' },
                            'User ID: ',
                            displayUserId
                        )
                    ),

                    // Content
                    React.createElement(AppContent, { 
                        db: db, 
                        userId: userId, 
                        isAuthReady: isAuthReady, 
                        showAlert: showAlert,
                        isDbConfigured: isDbConfigured,
                        speakText: speakText,
                        stopSpeaking: stopSpeaking,
                        isSpeaking: isSpeaking
                    })
                )
            );
        }

        // Mount the application to the DOM using the global ReactDOM object
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</body>
</html>
