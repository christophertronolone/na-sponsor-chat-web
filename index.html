<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narcotics Anonymous Sponsor Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        /* The max-height is now controlled by the parent flex container, but keep for fallback */
        #chat-window { overflow-y: auto; scroll-behavior: smooth; } 
        /* Important for formatting AI responses that may contain newlines */
        .chat-bubble { white-space: pre-wrap; } 
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-lg bg-white rounded-xl shadow-2xl p-6 flex flex-col h-[85vh]">
        <h1 class="text-3xl font-bold text-center text-indigo-700 mb-2">
            Narcotics Anonymous Sponsor
        </h1>
        <p id="user-info" class="text-xs text-center text-gray-500 mb-4">
            Guidance from Sponsor Sam (Stateless Chat)
        </p>

        <div id="chat-window" class="flex-grow space-y-4 p-4 border border-gray-200 rounded-lg mb-4 bg-gray-50">
            <div class="flex justify-start">
                <div class="chat-bubble max-w-[80%] p-3 rounded-xl shadow-sm bg-white border border-gray-200 text-gray-800 rounded-tl-none">
                    Welcome! How can I help you work your program today?
                </div>
            </div>
        </div>

        <div class="flex space-x-3">
            <input type="text" id="user-input" placeholder="Start your journey (e.g., 'I am struggling with step 1')"
                    class="flex-grow p-3 border border-indigo-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-150"
                    autofocus>
            <button id="send-button"
                    class="bg-indigo-600 text-white p-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-150 disabled:bg-indigo-300 disabled:cursor-not-allowed shadow-md">
                Send
            </button>
        </div>

        <div id="status-message" class="mt-3 text-sm text-center text-red-500 hidden"></div>
    </div>

    <script>
        // DOM elements
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const statusMessage = document.getElementById('status-message');

        let isSending = false;
        
        // FIX: Replaced empty string with a placeholder for the API key.
        // In a real environment, this should be set securely, e.g., via a backend or environment variable.
        // For local development, replace 'YOUR_GEMINI_API_KEY' with your actual key.
        const apiKey = "YOUR_GEMINI_API_KEY"; 
        const TEXT_MODEL = "gemini-2.5-flash"; // Using stable model name

        // --- UI Rendering ---
        function createMessageElement(content, isUser) {
            const wrapper = document.createElement('div');
            wrapper.className = isUser ? 'flex justify-end' : 'flex justify-start';

            const bubble = document.createElement('div');
            bubble.classList.add('chat-bubble', 'max-w-[80%]', 'p-3', 'rounded-xl', 'shadow-sm');
            
            if (isUser) {
                bubble.classList.add('bg-indigo-600', 'text-white', 'rounded-br-none');
            } else {
                // Initial message already uses rounded-tl-none, so we ensure the AI response follows the same style
                bubble.classList.add('bg-white', 'border', 'border-gray-200', 'text-gray-800', 'rounded-tl-none');
            }

            bubble.textContent = content;
            wrapper.appendChild(bubble);
            
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return bubble;
        }

        function toggleLoading(loading) {
            isSending = loading;
            sendButton.disabled = loading;
            userInput.disabled = loading;
            sendButton.textContent = loading ? 'Sending...' : 'Send';
            // Added visual feedback to the input field
            userInput.classList.toggle('opacity-50', loading); 
        }

        function displayStatus(message, isError = false) {
            statusMessage.textContent = message;
            statusMessage.classList.toggle('hidden', !message);
            statusMessage.classList.toggle('text-red-500', isError);
            statusMessage.classList.toggle('text-green-500', !isError && message);
        }

        // --- LLM API Call with Exponential Backoff (kept the robust existing logic) ---
        async function fetchWithBackoff(url, options, maxRetries = 5) {
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) {
                        return response;
                    } else if (response.status === 429 || response.status >= 500) {
                        const delay = Math.pow(2, attempt) * 1000 + (Math.random() * 1000);
                        console.warn(`API call failed (Status: ${response.status}). Retrying in ${Math.round(delay / 1000)}s...`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                    } else {
                        const errorText = await response.text();
                        // Throw specific error for key/auth issues
                        if (response.status === 400 || response.status === 403) {
                             throw new Error(`API Auth/Client Error ${response.status}: ${errorText}`);
                        }
                        throw new Error(`API Error ${response.status}: ${errorText}`);
                    }
                } catch (error) {
                    if (attempt === maxRetries - 1 || !/429|5\d{2}/.test(error.message)) {
                        throw error; 
                    }
                }
            }
        }
        
        // --- Chat Logic ---
        async function sendMessage() {
            const content = userInput.value.trim();
            if (!content || isSending) return;

            if (apiKey === "YOUR_GEMINI_API_KEY" || apiKey === "") {
                displayStatus("⚠️ Please set a valid Gemini API Key in the JavaScript code.", true);
                return;
            }

            toggleLoading(true);
            userInput.value = '';
            displayStatus("", false); // Clear previous status

            // 1. Display user message
            createMessageElement(content, true);

            // 2. Display AI 'thinking' placeholder
            const aiBubble = createMessageElement("", false); // Create empty bubble
            aiBubble.innerHTML = `<span class="animate-pulse">... Thinking ...</span>`;

            // 3. Call the Gemini (Text) API
            let aiResponseText = "Sorry, Sam couldn't connect. A non-recoverable error occurred. Please try again or reach out to a human sponsor.";
            try {
                // SYSTEM PROMPT FOR NA SPONSOR
                const systemPrompt = "You are an experienced Narcotics Anonymous (NA) Sponsor named Sam. Your purpose is to offer guidance, support, and advice to addicts in recovery, drawing exclusively from Narcotics Anonymous (NA) literature, including the Basic Text (It Works: How and Why), the NA Step Working Guide, and the Sponsorship Pathway to Daily Living (SPAD Daily Meditation). Respond with empathy, firmness, and wisdom, always grounding your advice in the Twelve Steps and Twelve Traditions of NA. Always speak from the perspective of a knowledgeable sponsor. Refer to yourself as Sam in your response. Never use generic names or placeholders in your response, instead refer to the user with a generic pronoun like 'my friend' or 'you'. Keep your response encouraging and concise.";
                
                const userQuery = content;
                // FIX: Use the recommended REST API endpoint format
                const textApiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${TEXT_MODEL}:generateContent?key=${apiKey}`;

                const payload = {
                    // FIX: Changed systemInstruction to be at the root of the payload for better clarity/compliance
                    // and formatted contents for a single turn conversation.
                    contents: [{ role: "user", parts: [{ text: userQuery }] }],
                    config: {
                         systemInstruction: systemPrompt 
                    }
                };

                const response = await fetchWithBackoff(textApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.error) {
                    throw new Error(result.error.message || "API returned an error object.");
                }

                // FIX: Correctly access the response text
                aiResponseText = result.candidates?.[0]?.content?.parts?.[0]?.text || aiResponseText;
                
            } catch (error) {
                console.error("Gemini operation failed:", error);
                
                let errorDisplayMessage = `AI Connection Failed. The network may be slow or the request timed out. Please try again.`;
                if (error.message.includes("403") || error.message.includes("Auth/Client Error")) {
                     errorDisplayMessage = `AI Key/Auth Error: Check your API key. It may be invalid or unauthorized.`;
                } else if (error.message.includes("rate limit")) {
                     errorDisplayMessage = `Rate Limit Exceeded: Please wait a moment before trying again.`;
                }
                
                aiResponseText = `[Sponsor Sam is unavailable: ${errorDisplayMessage}]`;
                displayStatus(`Full Error: ${error.message.substring(0, 100)}...`, true);

            } finally {
                // 4. Update the placeholder with the final text response
                aiBubble.textContent = aiResponseText;
                toggleLoading(false);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }

        // --- Initialize Event Listeners ---
        function initializeApp() {
            sendButton.addEventListener('click', sendMessage);
            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !isSending) {
                    sendMessage();
                }
            });
            userInput.focus();
        }

        initializeApp();

    </script>
</body>
</html>
